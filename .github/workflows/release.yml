name: Release

# Gera todos os arquivos da release, testa cada um em uma máquina ou contêiner
# limpo e publica a release no GitHub com as notas de
# .github/release-notes/<tag>.md. Roda ao enviar uma tag v* ou à mão (Actions →
# Release → Run workflow), informando uma tag que já exista.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.1.0); vazio usa a tag escolhida em "Use workflow from"'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  NFPM_VERSION: 2.49.0
  NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
  # Chave do desinstalador (AppId do packaging/windows/recortei.iss).
  WIN_UNINSTALL_KEY: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E2A776E0-CF17-4FE6-B7E8-B8A953B0FFF4}_is1

jobs:
  meta:
    name: Confere tag e notas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - id: version
        name: Tag, Cargo.toml, PKGBUILD e notas da release
        run: |
          version=$(grep -m1 '^version' Cargo.toml | tr -d '\r' | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::A tag $TAG não bate com a versão $version do Cargo.toml."
            exit 1
          fi
          pkgver=$(grep -m1 '^pkgver=' packaging/arch/PKGBUILD | cut -d= -f2)
          if [ "$pkgver" != "$version" ]; then
            echo "::error::O pkgver ($pkgver) do packaging/arch/PKGBUILD não bate com a versão $version."
            exit 1
          fi
          if [ ! -s ".github/release-notes/$TAG.md" ]; then
            echo "::error::Faltam as notas da release em .github/release-notes/$TAG.md."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (instalador e zip)
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compila
        run: cargo build --release --locked

      - name: Instala o Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }

      - name: Gera o instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\recortei.iss
          if ($LASTEXITCODE -ne 0) { throw "falha no ISCC ($LASTEXITCODE)" }

      - name: Gera o zip portátil
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "recortei-zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\recortei.exe, README.md $stage
          Copy-Item LICENSE (Join-Path $stage "LICENSE.txt")
          Compress-Archive -Path "$stage\*" -DestinationPath dist\recortei-windows-x86_64.zip -Force

      # Executável avulso para a atualização automática (assinado no job release).
      - name: Executável da atualização automática
        run: Copy-Item target\release\recortei.exe "dist\recortei-$env:VERSION-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/Recortei-Setup-x86_64.exe
            dist/recortei-windows-x86_64.zip
            dist/recortei-${{ env.VERSION }}-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Teste no Windows
    needs: [meta, windows]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist

      - name: Instalação silenciosa
        run: |
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $setup = Resolve-Path dist\Recortei-Setup-x86_64.exe
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "a instalação falhou (código $($p.ExitCode))" }

      - name: Confere arquivos, atalhos e desinstalador
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Recortei"
          foreach ($f in "recortei.exe", "recortei.ico", "README.md", "LICENSE.txt", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "faltou $f em $dir" }
          }
          foreach ($lnk in (Join-Path ([Environment]::GetFolderPath("Programs")) "Recortei.lnk"),
                           (Join-Path ([Environment]::GetFolderPath("Startup")) "Recortei.lnk")) {
            if (-not (Test-Path $lnk)) { throw "faltou o atalho $lnk" }
          }
          $entry = Get-ItemProperty $env:WIN_UNINSTALL_KEY
          if ($entry.DisplayName -ne "Recortei" -or $entry.DisplayVersion -ne $env:VERSION) {
            throw "entrada do desinstalador inesperada: $($entry.DisplayName) $($entry.DisplayVersion)"
          }
          if (-not $entry.UninstallString) { throw "entrada do desinstalador sem UninstallString" }

      - name: recortei.exe --version
        run: |
          function Test-Version($exe) {
            $out = Join-Path $env:RUNNER_TEMP "version.txt"
            $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            $text = "$(Get-Content $out -Raw)".Trim()
            Write-Host "$exe -> $text"
            if ($p.ExitCode -ne 0 -or $text -ne "recortei $env:VERSION") { throw "--version inesperado em $exe" }
          }
          Test-Version (Join-Path $env:LOCALAPPDATA "Programs\Recortei\recortei.exe")
          $zip = Join-Path $env:RUNNER_TEMP "zip"
          Expand-Archive dist\recortei-windows-x86_64.zip -DestinationPath $zip
          foreach ($f in "recortei.exe", "README.md", "LICENSE.txt") {
            if (-not (Test-Path (Join-Path $zip $f))) { throw "faltou $f no zip" }
          }
          Test-Version (Join-Path $zip "recortei.exe")
          Test-Version (Resolve-Path "dist\recortei-$env:VERSION-windows-x86_64.exe")

      - name: Desinstalação silenciosa
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Recortei"
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # O desinstalador se copia para a pasta temporária e continua de lá.
          for ($i = 0; $i -lt 60 -and ((Test-Path (Join-Path $dir "recortei.exe")) -or (Test-Path $env:WIN_UNINSTALL_KEY)); $i++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $dir "recortei.exe")) { throw "recortei.exe continua instalado" }
          if (Test-Path $env:WIN_UNINSTALL_KEY) { throw "a entrada do desinstalador continua no registro" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "Recortei.lnk")) { throw "o atalho do Menu Iniciar continua lá" }

  linux:
    name: Linux (tar.gz, .deb e .rpm)
    needs: meta
    # Compila no Ubuntu mais antigo disponível para exigir uma glibc antiga (2.35).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compila
        run: cargo build --release --locked

      - name: Gera o tar.gz
        run: |
          name="recortei-${VERSION}-linux-x86_64"
          stage="$RUNNER_TEMP/tar/$name"
          mkdir -p "$stage" dist
          install -m755 target/release/recortei install.sh "$stage/"
          install -m644 packaging/icons/recortei.svg "$stage/recortei.svg"
          install -m644 README.md LICENSE "$stage/"
          tar -C "$RUNNER_TEMP/tar" --owner=0 --group=0 --numeric-owner -czf dist/recortei-linux-x86_64.tar.gz "$name"
          tar -tzvf dist/recortei-linux-x86_64.tar.gz

      - name: Instala o nFPM
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Gera o .deb e o .rpm
        run: |
          RECORTEI_VERSION="$VERSION" nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/recortei-linux-amd64.deb
          RECORTEI_VERSION="$VERSION" nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/recortei-linux-x86_64.rpm

      # Executável avulso para a atualização automática (assinado no job release).
      - name: Executável da atualização automática
        run: cp target/release/recortei "dist/recortei-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            dist/recortei-linux-x86_64.tar.gz
            dist/recortei-linux-amd64.deb
            dist/recortei-linux-x86_64.rpm
            dist/recortei-${{ env.VERSION }}-linux-x86_64
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Arch Linux (makepkg)
    needs: meta
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependências de build
        run: pacman -Syu --noconfirm --needed base-devel git rust libxkbcommon wayland

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: makepkg (como usuário comum)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          build=/home/builder/pkg
          mkdir -p "$build" dist
          cp packaging/arch/PKGBUILD "$build/"
          # Mesmo nome e mesma pasta do tarball da tag no GitHub (source do PKGBUILD).
          git archive --format=tar.gz --prefix="Recortei-${VERSION}/" -o "$build/recortei-${VERSION}.tar.gz" HEAD
          chown -R builder: "$build"
          su builder -c "cd '$build' && makepkg --noconfirm"
          cp "$build/recortei-${VERSION}-1-x86_64.pkg.tar.zst" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-arch
          path: dist/recortei-${{ env.VERSION }}-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  linux-smoke:
    name: Teste em ${{ matrix.name }}
    needs: [meta, linux, arch]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (.deb)
            image: ubuntu:24.04
            artifact: dist-linux
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/recortei-linux-amd64.deb
          - name: Fedora 41 (.rpm)
            image: fedora:41
            artifact: dist-linux
            install: dnf install -y ./dist/recortei-linux-x86_64.rpm
          - name: Arch Linux (pacman -U)
            image: archlinux:latest
            artifact: dist-arch
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/recortei-${VERSION}-1-x86_64.pkg.tar.zst
          - name: Ubuntu 24.04 (tar.gz + install.sh)
            image: ubuntu:24.04
            artifact: dist-linux
            install: tarball
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Instala o pacote
        if: matrix.install != 'tarball'
        run: |
          set -euo pipefail
          ${{ matrix.install }}
          for f in /usr/bin/recortei \
                   /usr/share/applications/io.github.recortei.desktop \
                   /usr/share/icons/hicolor/scalable/apps/io.github.recortei.svg \
                   /usr/share/icons/hicolor/256x256/apps/io.github.recortei.png \
                   /usr/share/licenses/recortei/LICENSE; do
            test -s "$f" || { echo "::error::faltou $f"; exit 1; }
          done
          v=$(recortei --version)
          echo "$v"
          test "$v" = "recortei $VERSION"

      - name: Instala pelo tar.gz
        if: matrix.install == 'tarball'
        run: |
          set -euo pipefail
          mkdir -p /tmp/tar
          tar -xzf dist/recortei-linux-x86_64.tar.gz -C /tmp/tar
          d="/tmp/tar/recortei-${VERSION}-linux-x86_64"
          for f in recortei install.sh recortei.svg README.md LICENSE; do
            test -s "$d/$f" || { echo "::error::faltou $f no tar.gz"; exit 1; }
          done
          test "$("$d/recortei" --version)" = "recortei $VERSION"
          # Sem sessão gráfica: o install.sh instala, roda o --setup e não abre o app.
          export HOME=/tmp/home
          mkdir -p "$HOME"
          timeout 120 "$d/install.sh"
          test -x "$HOME/.local/bin/recortei"
          test -s "$HOME/.local/share/applications/io.github.recortei.desktop"
          test -s "$HOME/.local/share/icons/hicolor/scalable/apps/io.github.recortei.svg"
          v=$("$HOME/.local/bin/recortei" --version)
          echo "$v"
          test "$v" = "recortei $VERSION"

  release:
    name: Publica a release
    needs: [meta, windows, windows-smoke, linux, arch, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: |
            .github/release-notes
            packaging/updater.pub

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Atualização automática (src/update.rs): assina os executáveis avulsos
      # com a chave do updater (formato do `tauri signer`, a mesma convenção do
      # Zynko e da LowBloat; a privada fica em ~/.tauri/recortei-updater.key) e
      # gera o latest.json que o app consulta em releases/latest/download.
      - name: Assina a atualização automática e gera o latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta o secret TAURI_SIGNING_PRIVATE_KEY (chave do updater)."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          pub=$(base64 -d packaging/updater.pub | sed -n 2p)
          sigdir="$RUNNER_TEMP/sig"
          mkdir -p "$sigdir"
          platforms='{}'
          for plat in windows-x86_64 linux-x86_64; do
            ext=""
            [ "$plat" = windows-x86_64 ] && ext=".exe"
            f="recortei-${VERSION}-${plat}${ext}"
            # assina uma cópia: o .sig não vai para a release
            cp "dist/$f" "$sigdir/$f"
            npx --yes @tauri-apps/cli@2.12.6 signer sign "$sigdir/$f"
            sig=$(tr -d '\r\n' < "$sigdir/$f.sig")
            # confere com a chave pública embutida no app (pega secret trocado)
            echo "$sig" | base64 -d > "$sigdir/$f.minisig"
            minisign -V -m "$sigdir/$f" -x "$sigdir/$f.minisig" -P "$pub"
            platforms=$(jq --arg p "$plat" --arg url "$base/$f" --arg sig "$sig" \
              '. + {($p): {signature: $sig, url: $url}}' <<<"$platforms")
          done
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes ".github/release-notes/${TAG}.md" --argjson platforms "$platforms" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms}' > dist/latest.json
          jq '.notes |= .[:80]' dist/latest.json

      - name: Confere os arquivos e gera o SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          expected=(
            Recortei-Setup-x86_64.exe
            recortei-windows-x86_64.zip
            recortei-linux-x86_64.tar.gz
            recortei-linux-amd64.deb
            recortei-linux-x86_64.rpm
            "recortei-${VERSION}-1-x86_64.pkg.tar.zst"
            "recortei-${VERSION}-windows-x86_64.exe"
            "recortei-${VERSION}-linux-x86_64"
            latest.json
          )
          for f in "${expected[@]}"; do
            [ -s "$f" ] || { echo "::error::Faltou o arquivo $f"; exit 1; }
          done
          for f in *; do
            [[ " ${expected[*]} " == *" $f "* ]] || { echo "::error::Arquivo inesperado: $f"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Cria ou atualiza a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Recortei ${VERSION}" --notes-file "$notes"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Recortei ${VERSION}" --notes-file "$notes"
          fi
